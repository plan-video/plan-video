# Types, lint, tests and a build for every pull request and push to main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run check --workspaces --if-present
      - name: Lint
        run: npm run lint -w @plan.video/web
      - name: Translations
        run: node scripts/i18n.mjs check
      - name: Tests
        run: npm test -w @plan.video/web -w @plan.video/agent-chat -w @plan.video/dapi -w @plan.video/runtime
      - name: Build
        run: npm run build

  services:
    name: Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/*/package-lock.json
      - name: Install
        run: for lock in services/*/package-lock.json; do (cd "$(dirname "$lock")" && npm ci --no-audit --no-fund); done
      - name: Tests
        run: |
          for dir in services/*/; do
            if ls "$dir"*.test.mjs >/dev/null 2>&1; then
              echo "::group::$dir"
              (cd "$dir" && node --test --test-timeout=60000) || failed="$failed $dir"
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi

  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
